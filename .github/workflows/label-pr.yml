name: Label PR

# Labels PRs that touch the build configuration, the challenge statement, CI or the docs, and
# labels each PR by size, using the larger of its added and removed line counts: under 100 is
# extra small, under 1,000 small, under 10,000 medium, under 100,000 large, and 100,000 or more
# extra large. The counts are GitHub's own for the PR, so the job never downloads file contents.
# GitHub gives +0 -0 for a PR too large for it to diff, so the size is never taken to be less
# than the number of paths the PR changes.
#
# pull_request_target lets the token label PRs from forks. Nothing from the PR is checked out
# or run: the job fetches commits and trees without file contents and lists the changed paths
# with git. (The PR-files API, which actions/labeler uses, stops at 3,000 files; PRs here have
# changed over 10,000.) The labels must already exist.
#
# When a PR stops changing a label's paths, the label is removed only if this workflow added it
# (its latest "labeled" event is by github-actions[bot]); labels people add are left alone.
# Size labels are different: when the size label changes, the other size labels are removed,
# whoever added them.
# Since labels can be removed, only the run for the PR's current head may apply them: newer
# pushes cancel older runs, and a run whose head has moved on exits without changes.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: label-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Add and remove labels for this PR's paths and size
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git init -q pr
          # Fetch BASE from upstream; HEAD may be a fork-only commit, so fall back to API.
          # For huge PRs (10K+ files) the GitHub API can't diff either — size label still
          # works because it uses additions/deletions from the PR metadata, not a diff.
          set +e
          fetch_ok=false
          if git -C pr fetch -q --no-tags --filter=blob:none \
              "https://github.com/$GITHUB_REPOSITORY" "$BASE" "$HEAD"; then
            fetch_ok=true
          fi
          set -e
          
          if [[ "$fetch_ok" == "true" ]]; then
            git -C pr diff -z --name-only --no-renames "$BASE...$HEAD" > changed
          else
            echo "Could not fetch HEAD from upstream; falling back to GitHub API for paths."
            # Try API — if that also fails, create empty file so path-labels get skipped
            # gracefully while size-labels still compute from PR metadata above.
            set +e
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
              --jq '.[].filename' | tr '\n' '\0' > changed || true
            set -e
            if [[ -s changed ]]; then
              # Grab any remaining pages (API caps at 30 per page; pagination gives us rest).
              while read -r url; do
                set +e
                gh api "$url" --jq '.[].filename' | tr '\n' '\0' >> changed
                set -e
              done < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
                --jq '.[]._links.next // empty' 2>/dev/null)
            else
              touch changed
            fi
          fi

          lake='' challenge='' ci='' docs=''
          while IFS= read -r -d '' path; do
            case "$path" in
              lakefile.toml | lakefile.lean | lake-manifest.json | lean-toolchain)
                lake+="  $path"$'\n' ;;
            esac
            case "$path" in
              src/Challenge.lean | comparator.json | export-targets.txt)
                challenge+="  $path"$'\n' ;;
            esac
            case "$path" in
              .github/* | scripts/* | tools/* | .gitattributes)
                ci+="  $path"$'\n' ;;
            esac
            case "$path" in
              README.md | verification/*.md)
                docs+="  $path"$'\n' ;;
            esac
          done < changed

          add=() stale=()
          flag() {
            if [[ -n "$2" ]]; then
              printf '%s:\n%s' "$1" "$2"
              add+=("$1")
            else
              stale+=("$1")
            fi
          }
          flag changes-lake "$lake"
          flag changes-challenge "$challenge"
          flag CI "$ci"
          flag documentation "$docs"

          api="repos/$GITHUB_REPOSITORY/issues/$PR"
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '"\(.head.sha) \(.additions) \(.deletions)"')
          read -r current additions deletions <<< "$pr"
          if [[ "$current" != "$HEAD" ]]; then
            echo "The PR head has moved to $current; the run for that head applies its labels."
            exit 0
          fi

          # GitHub reports +0 -0 for a PR too large for it to diff, which would make the largest
          # PRs extra small. The number of changed paths is a floor for the size.
          paths=$(tr -cd '\0' < changed | wc -c)
          size=$(( additions > deletions ? additions : deletions ))
          size=$(( size > paths ? size : paths ))
          if (( size < 100 )); then
            size_label='extra small'
          elif (( size < 1000 )); then
            size_label=small
          elif (( size < 10000 )); then
            size_label=medium
          elif (( size < 100000 )); then
            size_label=large
          else
            size_label='extra large'
          fi
          echo "$size_label: +$additions -$deletions, $(( paths )) changed paths"
          wrong_size=()
          for label in 'extra small' small medium large 'extra large'; do
            if [[ "$label" == "$size_label" ]]; then add+=("$label"); else wrong_size+=("$label"); fi
          done

          present=$(gh api --paginate "$api/labels" --jq '.[].name')
          # When the size label changes, the other size labels are removed whoever added them.
          # While it stays the same, a size label someone adds alongside it is left alone.
          if grep -qxF -- "$size_label" <<< "$present"; then wrong_size=(); fi

          if (( ${#add[@]} > 0 )); then
            args=()
            for label in "${add[@]}"; do args+=(-f "labels[]=$label"); done
            gh api --method POST "$api/labels" "${args[@]}" --silent
          fi

          for label in "${stale[@]}"; do
            grep -qxF -- "$label" <<< "$present" || continue
            # Events are oldest first, so the last line is whoever added the label most recently.
            adder=$(gh api --paginate "$api/events" \
              --jq ".[] | select(.event == \"labeled\" and .label.name == \"$label\") | .actor.login" | tail -n 1)
            if [[ "$adder" == "github-actions[bot]" ]]; then
              echo "Removing $label: its paths are no longer changed."
              gh api --method DELETE "$api/labels/$label" --silent
            else
              echo "Keeping $label: added by ${adder:-unknown}, not by this workflow."
            fi
          done
          for label in "${wrong_size[@]}"; do
            grep -qxF -- "$label" <<< "$present" || continue
            echo "Removing $label: this PR is $size_label."
            gh api --method DELETE "$api/labels/${label// /%20}" --silent
          done
