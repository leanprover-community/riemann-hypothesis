name: Lean text style

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/lint-style.yml'
      - 'scripts/LintStyle.lean'
      - 'scripts/lint-style.py'
      - 'scripts/tests/test_lint_style.py'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Test diagnostic comparison
        run: python3 -I scripts/tests/test_lint_style.py

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore the Mathlib text-linter dependencies
        env:
          MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
        run: lake exe mathlib/cache get Mathlib.Tactic.Linter.TextBased

      - name: Check for new style violations
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 -I scripts/lint-style.py "$BASE"
