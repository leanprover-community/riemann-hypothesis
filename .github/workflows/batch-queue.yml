name: batch queue

# A maintainer queues a pull request for a batch build by commenting `batch`, or just `b`, on it.
# This records the commit that was the pull request's head when the comment was posted, adds the
# `batch queue` label, and merges that commit into the batch being assembled: a branch `batch/...`
# with its own pull request, which the workflow opens and keeps described. `batch <commit>`, with
# the full id of the head commit, names the commit outright. A batch takes only recorded commits.
# The label on its own queues nothing, and commits pushed later wait for another `batch`.
#
# A batch stops growing when it is frozen. That happens when a maintainer comments `freeze` on
# the batch pull request, or dispatches a build of it. The pull requests inside then swap
# `batch queue` for `building`, and later `batch` comments start a new batch. When a batch is
# merged, `building` comes off again and the batch branch is removed. When one is closed without
# being merged, its pull requests go back to `batch queue`.
#
# Commenting `-batch` takes a pull request out of the queue again: it withdraws the recorded
# commit and removes the `batch queue` label, and nothing else. Commits already merged into a
# batch stay there, and no batch is rebuilt, so a build that is under way is never disturbed.
#
# Commenting `aa` hands a pull request back to its author: it adds the `awaiting-author` label and
# nothing else. The inbox workflow takes a pull request with that label out of the inbox.
#
# A pull request that is closed, merged or not, loses `batch queue` and `building`. Reopened, it
# gets `batch queue` back if this workflow took the label off and nobody commented `-batch` on
# it meanwhile. A label a person took off stays off.
#
# The batches are the branches this workflow starts, named after the time they were started:
# `batch/2026-11-23-041230`, with `-2` and so on after it if that name was taken. A `batch/...`
# branch under another name, such as one a maintainer assembled by hand, is left alone: nothing
# is merged into it, its pull request cannot be frozen and its text is not rewritten.
#
# Only a comment whose whole text is one of these counts, letter case and surrounding blank space
# aside: `batch` or `b`, `batch <commit>` or `b <commit>`, `-batch` or `-b`, `freeze`, and `aa`.
# `aa` needs triage access to this repository and the others need write access. Every other
# comment is ignored. GitHub runs this workflow from the default branch for every event below, so
# a pull request cannot change what it does. Nothing from a pull request is checked out or run:
# GitHub performs the merges, and comparisons read git objects only.
#
# Queuing also compares the pull request with the others labelled `building` or `batch queue`
# and comments if git cannot merge it with one of them, or if one deletes a Lean file the other
# starts to import. That job only reports.
#
# The workflow can be started by hand to assemble the queue again, with a pull request number
# to repeat the comparison for that pull request.

on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [Build PR]
    types: [requested]
  pull_request_target:
    types: [closed, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to compare with the rest of the batch queue (optional)
        type: number
        required: false

permissions: {}

jobs:
  label:
    name: Act on a maintainer's `batch`, `-batch`, `freeze` or `aa` comment
    # A first filter, so that most comments start no runner: pull requests only, and the comment
    # has to contain one of the words. `b`, `-b` and `aa` are too short to look for anywhere in a
    # comment, so they are only noticed at its very start. startsWith ignores letter case. The
    # step below makes the exact comparison.
    if: >-
      ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request &&
          (contains(github.event.comment.body, 'batch') || contains(github.event.comment.body, 'freeze') ||
           startsWith(github.event.comment.body, 'b') || startsWith(github.event.comment.body, '-b') ||
           startsWith(github.event.comment.body, 'aa')) }}
    runs-on: ubuntu-latest
    # `contents: read` is for the log of pushes to a branch of this repository.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      queued: ${{ steps.label.outputs.queued }}
      unqueued: ${{ steps.label.outputs.unqueued }}
      frozen: ${{ steps.label.outputs.frozen }}
    steps:
      - name: Check the comment and its author, then add the label
        id: label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.comment.user.login }}
          BODY: ${{ github.event.comment.body }}
          WHEN: ${{ github.event.comment.created_at }}
          LABEL: batch queue
          FROZEN: building
          WAITING: awaiting-author
        run: |
          # The comment text arrives in an environment variable. It is compared and never run.
          text=$(printf '%s' "$BODY" | tr -d '\r' | tr '[:upper:]' '[:lower:]')
          # Drop blank space, line breaks included, from both ends.
          text="${text#"${text%%[![:space:]]*}"}"
          text="${text%"${text##*[![:space:]]}"}"
          # `batch <commit>` names the commit to queue.
          named=''
          with_commit='^(batch|b)[[:space:]]+([0-9a-f]{7,40})$'
          if [[ "$text" =~ $with_commit ]]; then
            named=${BASH_REMATCH[2]}
            text=batch
          fi
          case "$text" in
            b) text=batch ;;
            -b) text=-batch ;;
          esac
          case "$text" in
            batch | -batch | freeze | aa) ;;
            *)
              echo "The comment is not just 'batch', '-batch', 'freeze' or 'aa', or 'b' or '-b': nothing to do."
              exit 0
              ;;
          esac

          # Write access or higher, or triage access for `aa`. The API reports the maintain role
          # as write and triage as read under `permission`, so triage is told apart by `role_name`.
          if ! access=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq '.permission + " " + (.role_name // "")'); then
            echo "::error::Could not read the access $AUTHOR has to $REPO."
            exit 1
          fi
          read -r permission role <<< "$access"
          case "$permission" in
            admin | write) ;;
            *)
              if [ "$text" = aa ] && [ "$role" = triage ]; then
                :
              elif [ "$text" = aa ]; then
                echo "$AUTHOR has '${role:-$permission}' access. Labelling a pull request '$WAITING' needs triage access."
                exit 0
              else
                echo "$AUTHOR has '${role:-$permission}' access. Queuing, unqueuing or freezing needs write access."
                exit 0
              fi
              ;;
          esac

          say() {
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f "body=$1" --silent
          }

          if [ "$text" = aa ]; then
            # Back to the author. The label is all this does. Adding a label that does not exist
            # creates it, so a renamed `awaiting-author` should fail here instead.
            if ! gh api "repos/$REPO/labels/$(jq -rn --arg label "$WAITING" '$label | @uri')" --silent; then
              echo "::error::There is no '$WAITING' label in $REPO. Was it renamed?"
              exit 1
            fi
            gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$WAITING" --silent
            echo "Added '$WAITING' to pull request $PR, as $AUTHOR asked."
            exit 0
          fi

          if [ "$text" = freeze ]; then
            # Only a batch can be frozen: an open pull request from a branch of this repository
            # that the sync job started, `batch/` and a time. The label is the record that it is
            # frozen.
            head=$(gh api "repos/$REPO/pulls/$PR" --jq '(.head.repo.full_name // "-") + " " + .head.ref + " " + .state')
            read -r home ref state <<< "$head"
            own='^batch/[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{6}(-[0-9]+)?$'
            if [ "$home" != "$REPO" ] || [ "$state" != open ] || ! [[ "$ref" =~ $own ]]; then
              echo "Pull request $PR is not an open batch pull request of this workflow: nothing to freeze."
              exit 0
            fi
            gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$FROZEN" --silent
            echo "Froze batch pull request $PR, as $AUTHOR asked."
            echo "frozen=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$text" = -batch ]; then
            # Out of the queue: the queued commit is withdrawn and the label goes. Commits already
            # merged into a batch stay there, so no batch is rebuilt and no build is disturbed.
            # The withdrawal is recorded first, and whether or not the label is still there, so
            # that putting the label back by hand queues nothing.
            say "$(printf '<!-- batch-queue-withdrawn -->\nTaken out of the batch queue by `%s`.' "$AUTHOR")"
            if gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name' | grep -qxF -- "$LABEL"; then
              gh api -X DELETE "repos/$REPO/issues/$PR/labels/$(jq -rn --arg label "$LABEL" '$label | @uri')" --silent
              echo "Removed '$LABEL' from pull request $PR, as $AUTHOR asked."
            else
              echo "Pull request $PR does not carry '$LABEL'. The withdrawal is recorded all the same."
            fi
            echo "unqueued=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Adding a label that does not exist creates it. If `batch queue` is ever renamed, this
          # should fail and be noticed, not start a second label.
          if ! gh api "repos/$REPO/labels/$(jq -rn --arg label "$LABEL" '$label | @uri')" --silent; then
            echo "::error::There is no '$LABEL' label in $REPO. Was it renamed?"
            exit 1
          fi

          # The pull request's head now, and the repository and branch it comes from.
          {
            read -r head
            read -r home
            read -r branch
          } < <(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha, (.head.repo.full_name // ""), .head.ref')
          if ! [[ "$head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not read the head commit of pull request $PR."
            exit 1
          fi

          # The commit to queue is the one the maintainer was looking at, not the head as this job
          # finds it. The job starts some time after the comment, and the author is told about the
          # comment, so a push made in between would otherwise pass as approved.
          if [ -n "$named" ]; then
            if [ "${#named}" -lt 40 ]; then
              say "$(printf '<!-- batch-queue-help -->\nNothing was queued. `batch <commit>` needs the full 40-character commit id, because another commit can be made to share a shorter one. The head of this pull request is now:\n\n```\nbatch %s\n```' "$head")"
              echo "A short commit id was given: nothing queued."
              exit 0
            fi
            if [ "$named" != "$head" ]; then
              say "$(printf '<!-- batch-queue-help -->\nNothing was queued. `%s` is not the head of this pull request, which is now `%s`.' "$named" "$head")"
              echo "$named is not the head of pull request $PR: nothing queued."
              exit 0
            fi
            commit=$named
            why=$(printf 'the commit `%s` named' "$AUTHOR")
          else
            # The head as it was when the comment was posted, read from GitHub's log of pushes to
            # the branch: the newest push before the comment. The times in that log are GitHub's
            # own. Commit dates would not do, because the author sets them. A push in the same
            # second as the comment counts as after it.
            commit=''
            if [ -n "$home" ]; then
              pushes="repos/$home/activity?per_page=100&ref=$(jq -rn --arg ref "refs/heads/$branch" '$ref | @uri')"
              commit=$(gh api "$pushes" | jq -r --arg when "$WHEN" 'map(select(.timestamp < $when)) | first | .after // empty') || commit=''
            fi
            why=$(printf 'the head of this pull request when `%s` commented' "$AUTHOR")
            if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              say "$(printf '<!-- batch-queue-help -->\nNothing was queued. GitHub'"'"'s log of pushes to this branch did not show which commit was the head when you commented. Name the commit to queue. The head is now:\n\n```\nbatch %s\n```' "$head")"
              echo "Could not tell which commit was the head of pull request $PR at $WHEN: nothing queued."
              exit 0
            fi
          fi

          # The record first and the label second, so that a run which sees the label also sees
          # the record. The sync job trusts the record only at the start of a comment written by
          # this workflow.
          say "$(printf '<!-- batch-queue-approved %s -->\nQueued at `%s`, %s. A batch takes this commit and no other.' "$commit" "$commit" "$why")"
          echo "Recorded $commit as the queued commit."
          gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$LABEL" --silent
          echo "Added '$LABEL' to pull request $PR, as $AUTHOR asked."
          echo "queued=true" >> "$GITHUB_OUTPUT"

  started:
    name: Freeze a batch when a build of it is dispatched
    # Only builds a person dispatched. While full builds are manual-only, the runs GitHub starts
    # for each push are skipped, and those must not freeze anything.
    if: >-
      ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'workflow_dispatch' &&
          (startsWith(github.event.workflow_run.display_title, 'Build PR #') ||
           startsWith(github.event.workflow_run.display_title, 'Proof shard #')) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    outputs:
      frozen: ${{ steps.freeze.outputs.frozen }}
    steps:
      - name: Mark the batch pull request as building
        id: freeze
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TITLE: ${{ github.event.workflow_run.display_title }}
          FROZEN: building
        run: |
          # A build run is named after its pull request, for example "Proof shard #185 manual".
          number=$(printf '%s' "$TITLE" | sed -nE 's/^(Build PR|Proof shard) #([0-9]+)( .*)?$/\2/p' | head -n 1)
          if [ -z "$number" ]; then
            echo "No pull request number in the run name: nothing to do."
            exit 0
          fi
          # Only a batch the sync job started: a branch of this repository named `batch/` and a
          # time. A batch assembled by hand under another name is not frozen.
          head=$(gh api "repos/$REPO/pulls/$number" --jq '(.head.repo.full_name // "-") + " " + .head.ref + " " + .state')
          read -r home ref state <<< "$head"
          own='^batch/[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{6}(-[0-9]+)?$'
          if [ "$home" != "$REPO" ] || [ "$state" != open ] || ! [[ "$ref" =~ $own ]]; then
            echo "Pull request $number is not an open batch pull request of this workflow: nothing to freeze."
            exit 0
          fi
          gh api -X POST "repos/$REPO/issues/$number/labels" -f "labels[]=$FROZEN" --silent
          echo "Froze batch pull request $number: a build of it was dispatched."
          echo "frozen=true" >> "$GITHUB_OUTPUT"

  conflicts:
    name: Compare with the other queued pull requests
    needs: label
    # After the label job has just queued the pull request, or when started by hand with a pull
    # request number. `always()` is needed for the second case, where the label job is skipped.
    if: >-
      ${{ always() && (needs.label.outputs.queued == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.pr_number)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out this workflow's own copy of the scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
      # Pull request commits are fetched as git objects and compared with `git merge-tree`.
      # No pull request file is checked out or run.
      - name: Report conflicts with the rest of the queue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number || inputs.pr_number }}
        run: python3 scripts/batch-queue-conflicts.py --repo "$REPO" --pr "$PR" --comment --summary "$GITHUB_STEP_SUMMARY"

  reopened:
    name: Put `batch queue` back on a reopened pull request
    # The label comes back only if this workflow took it off when the pull request was closed,
    # and nobody commented `-batch` meanwhile. The script decides; this only starts it.
    if: ${{ github.event_name == 'pull_request_target' && github.event.action == 'reopened' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      restored: ${{ steps.reopened.outputs.restored }}
    steps:
      - name: Check out this workflow's own copy of the scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
      # Reads the pull request's labels, events and comments through the API. Nothing from the
      # pull request is checked out or run.
      - name: Put the label back if this workflow took it off
        id: reopened
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          said=$(python3 scripts/batch-queue-sync.py --repo "$REPO" --reopened "$PR" --summary "$GITHUB_STEP_SUMMARY")
          printf '%s\n' "$said"
          if printf '%s\n' "$said" | grep -qF "#$PR was reopened:"; then
            echo "restored=true" >> "$GITHUB_OUTPUT"
          fi

  sync:
    name: Assemble the batch and keep the labels in step
    needs: [label, started, reopened]
    # After a pull request was queued, unqueued or given its label back, after a batch was
    # frozen, merged or closed, after a labelled pull request was closed, or when started by
    # hand. Tidying up does not depend on the `pull_request_target` event: every run does it, so
    # it only happens sooner with the event.
    if: >-
      ${{ always() && (
          github.event_name == 'workflow_dispatch' ||
          needs.label.outputs.queued == 'true' || needs.label.outputs.unqueued == 'true' ||
          needs.label.outputs.frozen == 'true' ||
          needs.started.outputs.frozen == 'true' ||
          needs.reopened.outputs.restored == 'true' ||
          (github.event_name == 'pull_request_target' && github.event.action == 'closed' &&
           ((startsWith(github.event.pull_request.head.ref, 'batch/') &&
             github.event.pull_request.head.repo.full_name == github.repository) ||
            contains(github.event.pull_request.labels.*.name, 'batch queue') ||
            contains(github.event.pull_request.labels.*.name, 'building')))) }}
    runs-on: ubuntu-latest
    # One run at a time. A run still waiting when a newer one arrives can be dropped, and that
    # loses nothing: each run works from what GitHub shows now, not from what started it.
    concurrency:
      group: batch-queue-sync
      cancel-in-progress: false
    # `contents: write` to create batch branches and merge into them; `actions: read` to see
    # whether a build of the batch has been dispatched.
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out this workflow's own copy of the scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # No `ref`: the default is the commit GitHub runs this workflow from. When a pull request
        # from a fork is merged, that commit is also its merge commit, and checkout refuses it
        # when it is passed as `ref`.
        with:
          persist-credentials: false
          sparse-checkout: scripts
      # GitHub performs each merge through its API. No pull request file is checked out or run.
      - name: Merge queued commits into the batch and tidy up after batches that are finished with
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 scripts/batch-queue-sync.py --repo "$REPO" --summary "$GITHUB_STEP_SUMMARY"
