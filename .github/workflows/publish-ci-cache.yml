name: publish cache

# Publishes the cache outputs of every commit that lands on main, so that the next builds restore
# it exactly or as their baseline (CACHE.md).
#
# On a push to main it finds the build of that commit on the self-hosted runner: the merge
# queue's merge_group run (the queue moves main to the exact commit it built), else the push
# build of the commit, waiting for it to finish. It downloads that run's artifact cache-<commit>,
# checks it with the code of main (scripts/publish-ci-cache.py, which runs nothing from the
# artifact or the commit), and then publishes the new artifacts, the map, the module manifest
# to R2, never overwriting anything. The `accept` job then restores the selected receipt,
# existing or new, on a fresh runner and requires `lake build --no-build` to succeed.
# `activate` then confirms or creates exactly that public lookup record. The stage and
# activation steps see R2_ACCOUNT_TOKEN from the ci-cache-publish environment
# (deployable from main only).
#
# A manual run publishes a given commit's build (any successful self-hosted build.yml run of it
# with a cache artifact, for example a workflow_dispatch of build.yml on a test branch). With
# publish=false it only verifies, without the environment or the secret, from any branch.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit whose build to publish (full hash)
        required: true
        type: string
      run_id:
        description: The build.yml run to take it from (default the best one for the commit)
        required: false
        type: string
      publish:
        description: Publish (false only verifies)
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-cache-${{ inputs.sha || github.sha }}
  cancel-in-progress: false

jobs:
  stage:
    name: ${{ (github.event_name == 'push' || inputs.publish) && 'stage' || 'verify' }}
    if: github.repository == 'leanprover-community/riemann-hypothesis'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ (github.event_name == 'push' || inputs.publish) && 'ci-cache-publish' || '' }}
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      receipt: ${{ steps.stage.outputs.receipt }}
    steps:
      - name: Check out main's publishing code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Choose the commit
        id: target
        env:
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full commit hash"; exit 1; }
          git cat-file -e "$SHA^{commit}" 2>/dev/null || git fetch --no-tags origin "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Find the build of the commit
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          python3 -I scripts/ci-github.py find-run --sha "$SHA" ${RUN_ID:+--run-id "$RUN_ID"} \
            --wait-minutes ${{ github.event_name == 'push' && 90 || 0 }}

      - name: Download its cache outputs
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.run.outputs.artifact }}
          run-id: ${{ steps.run.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/staging

      - name: Install elan and the commit's toolchain
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          toolchain=$(git show "$SHA:lean-toolchain" | tr -d '[:space:]')
          [[ "$toolchain" =~ ^leanprover/lean4:v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]] || {
            echo "::error::unexpected toolchain $toolchain"; exit 1; }
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none --no-modify-path
          "$HOME/.elan/bin/elan" toolchain install "$toolchain"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify and stage the cache
        id: stage
        env:
          SHA: ${{ steps.target.outputs.sha }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          R2_ACCOUNT_TOKEN: ${{ (github.event_name == 'push' || inputs.publish) && secrets.R2_ACCOUNT_TOKEN || '' }}
        run: |
          # An artifact without new files has no artifacts/ directory.
          mkdir -p "$RUNNER_TEMP/staging/artifacts"
          extra=()
          receipt="$RUNNER_TEMP/candidate.json"
          if [[ "$PUBLISH" == true ]]; then
            extra+=(--stage-receipt "$receipt")
          fi
          python3 -I scripts/publish-ci-cache.py --sha "$SHA" --staging "$RUNNER_TEMP/staging" "${extra[@]}"
          if [[ "$PUBLISH" == true ]]; then
            printf 'receipt=%s\n' "$(base64 -w 0 "$receipt")" >> "$GITHUB_OUTPUT"
          fi

  accept:
    name: accept
    needs: stage
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the candidate's commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.stage.outputs.sha }}
          path: project
          persist-credentials: false

      - name: Check out main's cache restore code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: cache-tools
          persist-credentials: false

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore dependencies and accept the selected cache
        working-directory: project
        env:
          RECEIPT: ${{ needs.stage.outputs.receipt }}
          MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
        run: |
          [[ -n "$RECEIPT" ]]
          printf '%s' "$RECEIPT" | base64 --decode > "$RUNNER_TEMP/candidate.json"
          ulimit -Sn "$(ulimit -Hn)"
          lake exe mathlib/cache get
          export LAKE_CACHE_DIR="$PWD/.lake/cache"
          if [[ -d .lake/packages/TauCeti ]]; then
            python3 -I ../cache-tools/scripts/tauceti-cache-get.py --project "$PWD"
          fi
          if ! python3 -I ../cache-tools/scripts/ci-cache-get.py --candidate "$RUNNER_TEMP/candidate.json"; then
            echo "::error::Cache acceptance failed. If staging selected an active record, see CACHE.md#recovering-a-published-record."
            exit 1
          fi

  activate:
    name: activate
    needs: [stage, accept]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ci-cache-publish
    steps:
      - name: Check out main's publishing code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch the accepted commit if needed
        env:
          SHA: ${{ needs.stage.outputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full commit hash"; exit 1; }
          git cat-file -e "$SHA^{commit}" 2>/dev/null || git fetch --no-tags origin "$SHA"

      - name: Activate the accepted cache
        env:
          SHA: ${{ needs.stage.outputs.sha }}
          RECEIPT: ${{ needs.stage.outputs.receipt }}
          R2_ACCOUNT_TOKEN: ${{ secrets.R2_ACCOUNT_TOKEN }}
        run: |
          [[ -n "$RECEIPT" ]]
          printf '%s' "$RECEIPT" | base64 --decode > "$RUNNER_TEMP/candidate.json"
          python3 -I scripts/publish-ci-cache.py --sha "$SHA" --activate "$RUNNER_TEMP/candidate.json"
