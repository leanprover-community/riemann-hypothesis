name: comparator

# What can be checked of the two Comparator setups without the built proof. The first is
# Challenge.lean, comparator.json and export-targets.txt at the root; the second is in
# comparator/, and comparator/README.md describes it. This exports both challenges and compares
# the checksums, checks that the second challenge is formal-conjectures' text, and rehearses the
# judge for both setups with a placeholder for src/Main.lean. It is not a verdict on the proof,
# and it runs on GitHub-hosted runners.
# Whether a pull request changes a Comparator challenge file is checked in challenge-files.yml.

# The job reads only the files listed under `paths`, so it runs when one of those changes: on
# pull requests, on main, and by manual dispatch. Other changes cannot alter its result. Keep
# the two lists the same, and the job's sparse checkout within them. GitHub looks at the first
# 3,000 changed files only, so a larger pull request that changes one of these may need a manual
# dispatch.
on:
  push:
    branches: [main]
    paths:
      - Challenge.lean
      - comparator.json
      - export-targets.txt
      - comparator/**
      - src/Statements.lean
      - lakefile.toml
      - lake-manifest.json
      - lean-toolchain
      - .github/workflows/comparator.yml
  pull_request:
    branches: [main]
    paths:
      - Challenge.lean
      - comparator.json
      - export-targets.txt
      - comparator/**
      - src/Statements.lean
      - lakefile.toml
      - lake-manifest.json
      - lean-toolchain
      - .github/workflows/comparator.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comparator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rehearsal:
    name: Both challenges' checksums, formal-conjectures' text, and a rehearsal of the judge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEAN_ABORT_ON_PANIC: "1"   # as Comparator sets it for builds and exports
      MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4   # as in build.yml
      FC_REV: d8d031d4998c78575159ccab9a7a9e95ce043883
    steps:
      # Of the proof's source, only Statements.lean, which holds the solution's copy of the
      # definitions in Challenge.lean and which the bridge imports.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /lakefile.toml
            /lake-manifest.json
            /lean-toolchain
            /Challenge.lean
            /comparator.json
            /export-targets.txt
            /comparator/
            /src/Statements.lean
          sparse-checkout-cone-mode: false

      # The second challenge is a copy, so that it is built against this project's Mathlib and
      # not formal-conjectures'. This ties the copy to the text it was taken from.
      - name: The second challenge is formal-conjectures' text at the pinned commit
        run: |
          grep -q "$FC_REV" comparator/FormalConjecturesChallenge.lean
          python3 - <<'PY'
          import os, re, urllib.request

          def upstream(path):
              url = f"https://raw.githubusercontent.com/google-deepmind/formal-conjectures/{os.environ['FC_REV']}/{path}"
              return urllib.request.urlopen(url, timeout=60).read().decode()

          def cut(text, start, end):
              i = text.index(start)
              return text[i:text.index(end, i) + len(end)]

          def squash(text):
              return re.sub(r"\s+", " ", text).strip()

          rh = upstream("FormalConjectures/Millennium/RiemannHypothesis.lean")
          basic = upstream("FormalConjecturesForMathlib/NumberTheory/DirichletCharacter/Basic.lean")
          copied = {
              "instance": cut(basic, "instance {S : Type*}", "<| by rfl"),
              "riemannHypothesis": cut(rh, "/-- The **Riemann Hypothesis**", "sorry"),
              "trivialZeros": cut(rh, "/-- Let $\\chi$ be a Dirichlet character", "{ - 2 * n | (n : ℕ) }"),
              "generalized_riemann_hypothesis": cut(rh, "/-- The **Generalized Riemann Hypothesis**", "sorry"),
          }
          # The three differences the challenge file declares: formal-conjectures' own attributes
          # are left out, the instance has the name Lean generates for it upstream, and
          # `trivialZeros` is marked `noncomputable`, which Lean 4.36 and later want.
          copied = {k: re.sub(r"^@\[category[^\n]*\n", "", v, flags=re.M) for k, v in copied.items()}
          assert copied["instance"].count("instance {S") == 1
          assert copied["trivialZeros"].count("\ndef trivialZeros") == 1
          copied["instance"] = copied["instance"].replace(
              "instance {S", "instance instDecidablePredOddOfDecidableEq_formalConjecturesForMathlib {S")
          copied["trivialZeros"] = copied["trivialZeros"].replace("\ndef trivialZeros", "\nnoncomputable def trivialZeros")

          # A file must be this frame, with each <name> standing for that declaration as copied
          # above, and comments. So it has no `open`, option or declaration of its own.
          def check(file, frame):
              rest = squash(open(file, encoding="utf-8").read())
              for name in re.findall(r"<(\w+)>", frame):
                  if rest.count(squash(copied[name])) != 1:
                      raise SystemExit(f"{file}: `{name}` is not formal-conjectures' text")
                  rest = rest.replace(squash(copied[name]), f"<{name}>")
                  print(f"{file}: `{name}` matches")
              rest = squash(re.sub(r"/-.*?-/", " ", rest))
              if rest != squash(frame):
                  raise SystemExit(f"{file}: more than the copied declarations and comments:\n{rest}")
              print(f"{file}: nothing else but comments")

          check("comparator/FormalConjecturesChallenge.lean", """
              module public import Mathlib @[expose] public section
              namespace DirichletCharacter <instance> end DirichletCharacter
              namespace RiemannHypothesis <riemannHypothesis> end RiemannHypothesis
              namespace GRH <trivialZeros> <generalized_riemann_hypothesis> end GRH""")
          check("comparator/FormalConjecturesStatement.lean", """
              module public import Mathlib.NumberTheory.LSeries.DirichletContinuation
              @[expose] public section
              namespace DirichletCharacter <instance> end DirichletCharacter
              namespace GRH <trivialZeros> end GRH""")
          PY

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib's official build cache
        run: lake exe mathlib/cache get

      # Both are exported before either checksum is compared, so a change of pins shows both new
      # checksums in one run. Lake warns that Challenge.lean has no `module` header; it is the
      # file as it was written for the first version of this repository.
      - name: Compile and export both challenges
        run: |
          lake build Challenge
          lake env leanexport Challenge -- $(cat export-targets.txt) > "$RUNNER_TEMP/challenge.export"

          mkdir -p .lake/comparator
          lake env lean --root=comparator \
            -o .lake/comparator/FormalConjecturesChallenge.olean comparator/FormalConjecturesChallenge.lean
          LEAN_PATH="$PWD/.lake/comparator" lake env leanexport FormalConjecturesChallenge \
            -- $(cat comparator/formal-conjectures-export-targets.txt) > "$RUNNER_TEMP/fc-challenge.export"

          cd "$RUNNER_TEMP"
          for f in challenge.export fc-challenge.export; do
            sum=$(sha256sum "$f" | cut -d' ' -f1)
            echo "$sum  $f"
            {
              echo "### $f"
              echo "- sha256: \`$sum\`"
              echo "- size: $(wc -c < "$f") bytes, $(wc -l < "$f") lines"
            } >> "$GITHUB_STEP_SUMMARY"
          done
          # comparator/README.md quotes these checksums; fail if either export ever changes. A
          # change of pins changes them, and the step summary then shows the new ones.
          # These are for Lean v4.37.0-rc1 and Mathlib 31ce06ea, the pins branch `alpoge` ended
          # on: its CI checked the same two values.
          printf '%s  %s\n' \
            bb37c4bb518fe68a13f12aa3929dd62dfecb663f0c063ad8c338e39601f28a60 challenge.export \
            d08f9a601253ac28f09d7a64f674fd4227e665d573eae437a582f41f0ecb262c fc-challenge.export \
            | sha256sum -c

      # `Main.lean` is replaced by a placeholder: a module, as the real one is, that states the
      # five theorems and assumes them. Its export is the first setup's solution, and the second
      # setup's solution is compiled against it.
      - name: Compile both solutions against a placeholder Main, and export
        run: |
          out=.lake/comparator
          lake build +Statements
          printf '%s\n' 'module' '' 'public import Statements' '' '@[expose] public section' '' \
            'theorem riemannHypothesis : RiemannHypothesis := sorry' \
            'theorem riemannZeta_eq_zero_re : RiemannZetaZerosOnLine := sorry' \
            'theorem LFunction_ne_zero_of_half_lt_re : DirichletLNonvanishingRightOfHalf := sorry' \
            'theorem LFunction_eq_zero_re : DirichletLZerosOnLine := sorry' \
            'theorem LFunction_eq_zero_re_of_isPrimitive : PrimitiveDirichletLZerosOnLine := sorry' > "$RUNNER_TEMP/Main.lean"
          lake env lean --root="$RUNNER_TEMP" -o "$out/Main.olean" "$RUNNER_TEMP/Main.lean"
          LEAN_PATH="$PWD/$out" lake env leanexport Main \
            -- $(cat export-targets.txt) > "$RUNNER_TEMP/rehearsal.export"
          for m in FormalConjecturesStatement FormalConjecturesBridge FormalConjecturesSolution; do
            LEAN_PATH="$PWD/$out" lake env lean -DwarningAsError=true --root=comparator \
              -o "$out/$m.olean" "comparator/$m.lean"
          done
          LEAN_PATH="$PWD/$out" lake env leanexport FormalConjecturesSolution \
            -- $(cat comparator/formal-conjectures-export-targets.txt) > "$RUNNER_TEMP/fc-rehearsal.export"
      # Not a verdict on the proof. The exports were made above from files we trust, so the judge
      # runs without its sandbox.
      - name: Judge the rehearsals
        run: |
          # `lake comparator` looks for the checkers bundled with Lean on PATH.
          PATH="$(lean --print-prefix)/bin:$PATH"
          first="$PWD/comparator.json"
          second="$PWD/comparator/formal-conjectures.json"
          mkdir "$RUNNER_TEMP/judge"
          cd "$RUNNER_TEMP/judge"
          judge() {
            lake comparator --inadvisably-no-sandbox --config "$1" \
              --challenge-from-export "$RUNNER_TEMP/$2" --solution-from-export "$RUNNER_TEMP/$3"
          }
          # rehearse <name> <config> <challenge export> <solution export>
          rehearse() {
            # With the real config the placeholder's `sorry` must be the one thing rejected: the
            # statements, and the definitions they use, already match the challenge's.
            if judge "$2" "$3" "$4" > "$1.log" 2>&1; then
              cat "$1.log"
              echo "$2 accepted a solution that uses sorry"
              exit 1
            fi
            cat "$1.log"
            grep -q "Illegal axiom detected: 'sorryAx'" "$1.log"

            # With `sorryAx` permitted as well, every kernel must accept. For the second setup
            # that checks the bridge.
            python3 -c 'import json, sys; c = json.load(open(sys.argv[1])); c["permitted_axioms"].append("sorryAx"); json.dump(c, sys.stdout)' \
              "$2" > "$1.json"
            judge "$PWD/$1.json" "$3" "$4"
          }
          rehearse first "$first" challenge.export rehearsal.export
          rehearse second "$second" fc-challenge.export fc-rehearsal.export
