name: challenge files

# The Comparator challenge files say what the proof is judged against, so a pull request may not
# change them. This runs the base branch's copy of the workflow and nothing from the pull
# request: it reads file hashes through the API. A pull request cannot switch it off, and it
# needs no approval to run on a pull request from a fork.

on:
  pull_request_target:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to check
        type: number
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  frozen:
    name: Comparator challenge files are unchanged
    runs-on: ubuntu-latest
    steps:
      - name: Compare the files where the pull request branched off and at its head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          frozen="src/Challenge.lean comparator.json export-targets.txt
            comparator/FormalConjecturesChallenge.lean comparator/formal-conjectures.json
            comparator/formal-conjectures-export-targets.txt"

          base=$(gh api "repos/$REPO/pulls/$PR" --jq .base.sha)
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          # Get the fork owner to query blobs there (upstream won't know fork commits).
          fork_owner=$(echo "${{ github.event.pull_request.head.repo.full_name }}" | cut -d/ -f1)
          echo "pull request $PR: base $base, head $head, fork=$fork_owner"

          # The blob hash of a file at a commit; tries upstream first, then fork.
          # A pull request may not change challenge files, so we compare old vs new hashes.
          blob() {
            local sha="$1" path="$2" out=""
            # Try upstream first (works if commit is indexed there).
            out=$(gh api "repos/$REPO/contents/$path?ref=$sha" --jq .sha 2>/dev/null || true)
            [ -n "$out" ] && { printf '%s\n' "$out"; return; }
            # Fall back to fork — works when commit is only known on the fork.
            if [ -n "$fork_owner" ] && [ "$fork_owner" != "$(echo "$REPO" | cut -d/ -f1)" ]; then
              out=$(gh api "repos/$fork_owner/$REPO/contents/$path?ref=$sha" \
                --jq .sha 2>/dev/null || true)
            fi
            if [ -n "$out" ]; then printf '%s\n' "$out"; else echo ""; fi
          }

          status=0
          for path in $frozen; do
            base_hash=$(blob "$base" "$path")
            head_hash=$(blob "$head" "$path")
            if [ -n "$base_hash" ] && [ "$base_hash" != "$head_hash" ]; then
              echo "::error file=$path::This pull request changes $path, a Comparator challenge file."
              status=1
            else
              echo "unchanged: $path"
            fi
          done
          if [ "$status" != 0 ]; then
            echo "These files say what the proof is judged against, and pull requests may not change them."
            echo "A maintainer who means to change one has to say so and update the notes."
          fi
          exit "$status"
