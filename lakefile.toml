# Added for the shared build cache (see ../CACHE.md). The rest of this file, up to the
# next such comment, is unchanged from grh-lean commit 72fead1.
platformIndependent = true

name = "GRH"
srcDir = "src"
defaultTargets = ["Lib", "New", "Main"]
moreLeanArgs = ["--tstack=400000"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
pp.unicode.fun = true
maxHeartbeats = 4000000

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "31ce06eaadf4a200c0e1407c5f10953cf606b8f8"

# Added for Tau Ceti (see CACHE.md): https://github.com/TauCetiProject/TauCeti at a commit of its
# main branch (6d810e58, 26 Nov 2026) whose cache Tau Ceti has published, on the same Lean and
# Mathlib as its tag v4.37.0-rc1. Its cached oleans are only usable if it was built against the
# Mathlib commit above, so the two pins move together; `lake exe cache get` checks this
# (scripts/tauceti-cache-get.py).
[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "6d810e58e90dc1a8f89e5cb6056ee36c26da67d3"

# The rest of this file, up to the next "Added" comment, is unchanged from grh-lean commit 72fead1.

[[lean_lib]]
name = "Lib"
globs = ["Lib.+"]

[[lean_lib]]
name = "New"
globs = ["New.+"]

[[lean_lib]]
name = "Main"
roots = ["Statements", "Main"]

[[lean_lib]]
name = "Challenge"
srcDir = ".."

# Added for the shared build cache. It is not part of the original project.
[[lean_exe]]
name = "cache"
root = "scripts.Cache"
srcDir = ".."

# Stock Lake also reads this file as its cache-service configuration (LAKE_CONFIG).
[cache]
defaultService = "grh-lean"

[[cache.service]]
name = "grh-lean"
kind = "s3"
artifactEndpoint = "https://rh-cache.taucetiproject.org/artifacts"
revisionEndpoint = "https://rh-cache.taucetiproject.org/grh-lean/revisions"

# Added for Tau Ceti: its public, anonymous artifact cache. `lake exe cache get` fetches from it
# the oleans of the Tau Ceti modules imported under src (scripts/tauceti-cache-get.py).
[[cache.service]]
name = "tauceti-public"
kind = "s3"
artifactEndpoint = "https://cache.taucetiproject.org/artifacts"
revisionEndpoint = "https://cache.taucetiproject.org/revisions"
